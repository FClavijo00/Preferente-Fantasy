<ion-card class="cambiar-pass-card" mode="ios">
  <ion-card-content>
    <form [formGroup]="cambiarPasswordForm" (ngSubmit)="cambiarPassword()">
      <ion-input
        class="outline-input ion-margin-bottom ion-margin-top"
        mode="md"
        label="Contraseña actual"
        label-placement="stacked"
        fill="outline"
        type="password"
        autocomplete="current-password"
        formControlName="passwordActual"
        errorText="Introduce tu contraseña actual"
      >
        <ion-input-password-toggle slot="end" color="medium"></ion-input-password-toggle>
      </ion-input>

      <ion-input
        class="outline-input ion-margin-bottom"
        mode="md"
        label="Nueva contraseña"
        label-placement="stacked"
        fill="outline"
        type="password"
        autocomplete="new-password"
        formControlName="passwordNueva"
        helperText="Mínimo 6 caracteres"
        errorText="Mínimo 6 caracteres"
      >
        <ion-input-password-toggle slot="end" color="medium"></ion-input-password-toggle>
      </ion-input>

      <ion-input
        class="outline-input ion-margin-bottom"
        mode="md"
        label="Confirmar nueva contraseña"
        label-placement="stacked"
        fill="outline"
        type="password"
        autocomplete="new-password"
        formControlName="confirmarPassword"
        errorText="Repite la nueva contraseña"
      >
        <ion-input-password-toggle slot="end" color="medium"></ion-input-password-toggle>
      </ion-input>

      @if (cambiarPasswordForm.hasError('noCoinciden') && cambiarPasswordForm.controls.confirmarPassword.touched) {
        <p class="form-error" role="alert">Las contraseñas nuevas no coinciden.</p>
      }

      <ion-button type="submit" expand="block" class="neon-button" [disabled]="enviando()">
        Cambiar contraseña
      </ion-button>
    </form>
  </ion-card-content>
</ion-card>
