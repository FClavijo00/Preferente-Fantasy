<ion-header class="pf-header ion-no-border">
  <ion-toolbar>
    <div class="fila">
      <!-- Sale de la liga y vuelve a recepción -->
      <button type="button" class="btn-ligas" (click)="backRecepcion()" aria-label="Mis ligas (volver a recepción)" title="Mis ligas">
        <ion-icon name="swap-horizontal-outline" aria-hidden="true"></ion-icon>
      </button>

      <h1 class="titulos">
        <span class="seccion">{{ seccion }}</span>
        <span class="liga">{{ liga()?.nombre_liga }}</span>
      </h1>

      <!-- Acciones propias de cada pantalla (p. ej. la ⓘ de Clasificaciones) -->
      <div class="acciones">
        <ng-content select="[acciones]"></ng-content>
      </div>
    </div>
  </ion-toolbar>
</ion-header>
