<ion-header>
  <ion-toolbar mode="md">
    @if (titulo === "Home") {
      <ion-buttons slot="start">
        <ion-button (click)="backRecepcion()">
          <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
          <!-- <ion-icon slot="icon-only" name="trophy-outline"></ion-icon> -->
        </ion-button>
      </ion-buttons>
      <div class="div-img-title">
        <img src="assets/images/pf-logo-v2.svg" alt="Logo PF" />
        <h3 class="ion-no-margin">Inicio</h3>
      </div>
    } @else if (titulo === "Plantillas") {
      <ion-buttons slot="start">
        <ion-button (click)="backRecepcion()">
          <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
          <!-- <ion-icon slot="icon-only" name="trophy-outline"></ion-icon> -->
        </ion-button>
      </ion-buttons>
      <div class="div-img-title">
        <img src="assets/images/pf-logo-v2.svg" alt="Logo PF" />
        <h3 class="ion-no-margin">Plantillas</h3>
      </div>
    }
  </ion-toolbar>
</ion-header>
