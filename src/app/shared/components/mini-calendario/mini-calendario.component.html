<ul class="rejilla" aria-label="Partidos de la jornada">
  @for (p of partidos(); track p.partido_id) {
  <li class="partido" [attr.aria-label]="p.local_nombre + ' contra ' + p.visitante_nombre + ', ' + (cuando(p) ?? 'fecha por confirmar')">
    <div class="enfrentamiento" aria-hidden="true">
      <img class="escudo" [src]="p.local_escudo || 'assets/escudos/default.png'" alt="" width="22" height="22"
        loading="lazy" [title]="p.local_nombre" />
      <span class="vs">VS</span>
      <img class="escudo" [src]="p.visitante_escudo || 'assets/escudos/default.png'" alt="" width="22" height="22"
        loading="lazy" [title]="p.visitante_nombre" />
    </div>
    @if (cuando(p); as c) {
    <span class="cuando" aria-hidden="true">{{ c }}</span>
    } @else {
    <span class="cuando sin-fecha" aria-hidden="true">Por confirmar</span>
    }
  </li>
  } @empty {
  <li class="vacio">No hay partidos cargados</li>
  }
</ul>
