<ion-header class="ion-no-border">
  <div class="cabecera">
    <div>
      <h2>Ajustar foto</h2>
      <p>Arrastra y amplía para encuadrarla</p>
    </div>
    <button type="button" class="btn-cerrar" (click)="cancelar()" aria-label="Cancelar">
      <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
    </button>
  </div>
</ion-header>

<ion-content class="recorte">
  <div class="lienzo">
    @if (cargando()) {
    <ion-spinner name="crescent"></ion-spinner>
    }
    <!-- Guía redonda: las fotos se muestran en círculo en toda la app (el archivo sigue siendo cuadrado) -->
    <image-cropper
      [class.oculto]="cargando()"
      [imageChangedEvent]="imageChangedEvent"
      [maintainAspectRatio]="true"
      [aspectRatio]="1"
      [roundCropper]="true"
      [resizeToWidth]="300"
      [resizeToHeight]="300"
      format="webp"
      (imageCropped)="imageCropped($event)"
      (cropperReady)="cargando.set(false)"
      (loadImageFailed)="errorCarga()"
    ></image-cropper>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="pie">
    <ion-button mode="md" class="btn-tonal" (click)="cancelar()">Cancelar</ion-button>
    <ion-button mode="md" class="btn-principal" [disabled]="!croppedImageFile" (click)="confirmar()">
      Usar foto
    </ion-button>
  </div>
</ion-footer>
