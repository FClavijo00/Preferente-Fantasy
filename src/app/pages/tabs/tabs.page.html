<ion-tabs (ionTabsDidChange)="setCurrentTab($event)">
  <ion-tab-bar slot="bottom" mode="ios" class="pf-tab-bar">
    @for (p of pestanas; track p.tab) {
    @let activa = pestanaActual() === p.tab;
    <ion-tab-button
      [tab]="p.tab"
      [href]="'/tabs/' + p.tab"
      [class.central]="p.central"
      [attr.aria-label]="etiqueta(p)"
    >
      @if (p.central) {
      <!-- Botón central: círculo verde discreto -->
      <span class="central-circulo" aria-hidden="true">
        <ion-icon [name]="p.icono"></ion-icon>
        <!-- Aviso: naranja = sin hacer o incompleta · rojo = cierra en menos de un día -->
        @if (avisoAlineacion(); as aviso) {
        <span [class]="'aviso-punto ' + aviso.nivel"></span>
        }
      </span>
      } @else {
      <!-- Píldora detrás del icono (se ilumina en la pestaña activa) -->
      <span class="pildora" aria-hidden="true">
        <ion-icon [name]="activa ? p.iconoActivo : p.icono"></ion-icon>
      </span>
      }
      <ion-label>{{ p.titulo }}</ion-label>
    </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
