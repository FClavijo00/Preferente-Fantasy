<ion-content>
  <div class="auth-page">
    <a routerLink="/landing-page" class="auth-back">
      <ion-icon name="arrow-back-outline" aria-hidden="true"></ion-icon>
      Inicio
    </a>

    <main class="auth-card">
      <header class="auth-brand">
        <img
          src="assets/images/pf-logo-v2.svg"
          alt=""
          class="auth-logo auth-logo-lg"
          width="120"
          height="120"
        />
        <h1 class="brand-title">
          PREFERENTE <span class="highlight">FANTASY</span>
        </h1>
        <p>Inicia sesión para gestionar tus campeonatos</p>
      </header>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" novalidate>
        <ion-input
          class="auth-input"
          mode="md"
          fill="outline"
          label="Correo electrónico"
          label-placement="stacked"
          type="email"
          inputmode="email"
          autocomplete="email"
          formControlName="email"
          errorText="Introduce un correo electrónico válido"
        >
          <ion-icon
            [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
            name="mail-outline"
            slot="start"
            class="input-icon"
            aria-hidden="true"
          ></ion-icon>
        </ion-input>

        <ion-input
          class="auth-input"
          mode="md"
          fill="outline"
          label="Contraseña"
          label-placement="stacked"
          type="password"
          autocomplete="current-password"
          formControlName="password"
          errorText="Introduce tu contraseña"
        >
          <ion-icon
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            name="lock-closed-outline"
            slot="start"
            class="input-icon"
            aria-hidden="true"
          ></ion-icon>
          <ion-input-password-toggle
            slot="end"
            color="medium"
          ></ion-input-password-toggle>
        </ion-input>

        <ion-button
          type="submit"
          expand="block"
          class="auth-submit"
          [disabled]="enviando()"
        >
          Iniciar sesión
        </ion-button>
      </form>

      <p class="auth-help">
        ¿Has olvidado tu contraseña?
        <a
          href="https://instagram.com/preferentefantasy"
          target="_blank"
          rel="noopener"
          >Escríbenos</a
        >
      </p>

      <p class="auth-switch">
        ¿Aún no tienes equipo?
        <a routerLink="/register">Regístrate gratis</a>
      </p>
    </main>

    <footer class="auth-credits">
      <p>Preferente Fantasy v2.0 © {{ anioActual }}</p>
      <p>Desarrollado por Francisco José Clavijo</p>
    </footer>
  </div>
</ion-content>
