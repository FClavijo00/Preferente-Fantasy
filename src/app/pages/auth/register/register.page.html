<ion-content class="ion-padding">
  <div class="auth-container">
    <!-- Header / Branding -->
    <div class="brand-section ion-text-center">
      <img
        src="assets/images/pf-logo-v2.svg"
        alt="Preferente Fantasy"
        class="auth-logo"
      />
      <h1 class="fantasy-title">PREFERENTE FANTASY</h1>
      <p class="auth-subtitle">
        Crea tu perfil de mánager y sé el mejor de la provincia
      </p>
    </div>

    <!-- Formulario de Login -->
    <form [formGroup]="registerForm">
      <!-- <div class="avatar-upload-container ion-margin-bottom">
        <label for="avatarInput" class="avatar-label">
          <div
            class="avatar-preview"
            [style.background-image]="avatarPreview() ? 'url(' + avatarPreview() + ')' : null"
          >
            @if (!avatarPreview()) {
            <ion-icon name="camera-outline" class="camera-icon"></ion-icon>
            }
          </div>
          <span class="upload-hint"
            >{{ avatarPreview() ? 'Cambiar foto' : 'Añadir foto' }}</span
          >
        </label>
        <input
          type="file"
          id="avatarInput"
          accept="image/*"
          (change)="onFileSelected($event)"
          hidden
        />
      </div> -->

      <ion-input
        class="login-outline-input ion-margin-bottom"
        mode="md"
        label="Nombre Usuario"
        label-placement="stacked"
        fill="outline"
        type="text"
        formControlName="username"
      >
        <ion-icon
          name="person-circle-outline"
          slot="start"
          class="input-icon"
        ></ion-icon>
      </ion-input>

      <ion-input
        class="login-outline-input ion-margin-bottom"
        mode="md"
        label="Nombre Club"
        label-placement="stacked"
        fill="outline"
        type="text"
        formControlName="club"
      >
        <ion-icon
          name="football-outline"
          slot="start"
          class="input-icon"
        ></ion-icon>
      </ion-input>

      <ion-input
        class="login-outline-input ion-margin-bottom"
        mode="md"
        label="Correo Electrónico"
        label-placement="stacked"
        fill="outline"
        type="email"
        formControlName="email"
      >
        <ion-icon
          name="mail-outline"
          slot="start"
          class="input-icon"
        ></ion-icon>
      </ion-input>

      <ion-input
        class="login-outline-input ion-margin-bottom"
        mode="md"
        label="Contraseña"
        label-placement="stacked"
        fill="outline"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
      >
        <ion-icon
          name="lock-closed-outline"
          slot="start"
          class="input-icon"
        ></ion-icon>
        <ion-button
          mode="ios"
          slot="end"
          fill="clear"
          (click)="toggleShowPassword()"
        >
          <ion-icon
            slot="icon-only"
            class="input-icon"
            [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'"
          ></ion-icon>
        </ion-button>
      </ion-input>

      <ion-button
        expand="block"
        type="submit"
        [disabled]="registerForm.invalid"
        class="btn-pitch"
        (click)="onRegister()"
      >
        @if (loadingSpinner()) {
        <ion-spinner name="crescent"></ion-spinner>
        } REGISTRAR
      </ion-button>
    </form>

    <!-- Footer / Acceso a Registro -->
    <div class="auth-footer ion-text-center ion-margin-top">
      <p>
        ¿Ya tienes cuenta creada?
        <a (click)="backLogin()">Volver al login</a>
      </p>
    </div>
  </div>
</ion-content>
