<ion-header class="ion-no-border">
  <ion-toolbar class="main-toolbar">
    <ion-buttons slot="start">
      <ion-button mode="ios" (click)="volverRecepcion()" aria-label="Volver a recepción">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <div class="titulo-panel">
      <img src="assets/images/pf-logo-v2.svg" alt="" width="28" height="28" />
      <ion-title>Panel de Control</ion-title>
    </div>
  </ion-toolbar>

  <!-- Secciones: siempre a la vista, sin menú lateral -->
  <ion-toolbar class="secciones-toolbar">
    <ion-segment
      mode="ios"
      [scrollable]="true"
      [value]="content()"
      (ionChange)="abrirSeccion($event.detail.value)"
      class="secciones"
    >
      @for (s of secciones; track s.id) {
      <ion-segment-button [value]="s.id" layout="icon-start">
        <ion-icon [name]="s.icono"></ion-icon>
        <ion-label>{{ s.titulo }}</ion-label>
      </ion-segment-button>
      }
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="main-content">
    @if (content() === 'jornadas') {
    <app-jornadas-admin></app-jornadas-admin>
    } @else if (content() === 'calendario') {
    <app-calendario-admin></app-calendario-admin>
    } @else if (content() === 'jugadores') {
    <app-jugadores-admin></app-jugadores-admin>
    } @else if (content() === 'onceideal') {
    <app-once-ideal-admin></app-once-ideal-admin>
    }
</ion-content>
